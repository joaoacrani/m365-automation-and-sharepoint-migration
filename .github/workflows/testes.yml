name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester:
    name: Pester (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o Pester 3.4
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Rodar os testes
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester .\Testes -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
